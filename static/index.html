<!DOCTYPE html>
<html>
<head>
    <title>AKS AI Troubleshooter</title>
    style.css
</head>

<body>

<div class="container">

    <h1>AKS AI Troubleshooter</h1>

    <div class="cards">

        <div class="card">
            <h3>Total Pods</h3>
            <p id="totalPods">-</p>
        </div>

        <div class="card healthy">
            <h3>Healthy Pods</h3>
            <p id="healthyPods">-</p>
        </div>

        <div class="card unhealthy">
            <h3>Unhealthy Pods</h3>
            <p id="unhealthyPods">-</p>
        </div>

    </div>

    <h2>Namespace Summary</h2>

    <table id="namespaceTable">
        <thead>
            <tr>
                <th>Namespace</th>
                <th>Total</th>
                <th>Healthy</th>
                <th>Unhealthy</th>
            </tr>
        </thead>

        <tbody></tbody>
    </table>

    <h2>Unhealthy Pods</h2>

    <div id="issues"></div>

    <h2>AI Analysis</h2>

    <button onclick="runAnalysis()">
        Analyze Cluster
    </button>

    <pre id="analysis"></pre>

</div>

app.jsscript>

</body>
</html>
